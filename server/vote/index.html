<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新功能投票 · Plain Craft Launcher 3</title>
<link rel="icon" href="../icon.ico" sizes="any">
<link rel="shortcut icon" href="../icon.ico">
<style>
  :root {
    --bg: #eef1f6; --surface: #fff; --surface-2: #f8fafc;
    --line: #e2e6ec; --line-strong: #cbd2dc;
    --text: #111827; --text-2: #4b5563; --text-3: #9099a6;
    --accent: #0b5fd4; --accent-2: #0848a3; --accent-soft: #eaf1fd;
    --ok: #047857; --ok-soft: #e6f6ef;
    --warn: #b45309; --warn-soft: #fdf4e6;
    --err: #b42318; --err-soft: #fdf0ef;
    --violet: #6d28d9; --violet-soft: #f1ecfd;
    --radius: 14px; --radius-sm: 8px;
    --shadow-sm: 0 1px 2px rgba(16,24,40,.05);
    --shadow: 0 1px 3px rgba(16,24,40,.06), 0 4px 14px rgba(16,24,40,.05);
    --shadow-lg: 0 8px 28px rgba(16,24,40,.10), 0 28px 64px rgba(16,24,40,.09);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1100px 560px at 6% -14%, #d9e7fd 0%, transparent 58%),
      radial-gradient(880px 500px at 98% -4%, #e8ecf5 0%, transparent 54%),
      var(--bg);
    color: var(--text);
    font: 14px/1.62 -apple-system, "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }

  .shell { max-width: 820px; margin: 0 auto; padding: 30px 22px 56px; }

  .hero {
    position: relative; overflow: hidden; border-radius: var(--radius);
    box-shadow: var(--shadow-lg); color: #fff; padding: 28px 30px 26px; margin-bottom: 20px;
    background: linear-gradient(128deg, #0b5fd4 0%, #1a54b8 46%, #5b2ea8 100%);
  }
  .hero::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(620px 320px at 88% -30%, rgba(255,255,255,.22), transparent 62%);
    pointer-events: none;
  }
  .hero-inner { position: relative; z-index: 1; }
  .hero-top { display: flex; align-items: center; gap: 14px; }
  .hero-top img {
    width: 48px; height: 48px; border-radius: 12px; flex: none;
    background: #fff; border: 1px solid rgba(255,255,255,.5);
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
  }
  .hero-top h1 { font-size: 19px; font-weight: 650; letter-spacing: -.02em; }
  .hero-top p { font-size: 12.5px; opacity: .78; margin-top: 2px; }
  .hero-top .right { margin-left: auto; }
  .btn-back {
    display: inline-flex; align-items: center; height: 32px; padding: 0 14px;
    font-size: 12.5px; color: #fff; white-space: nowrap;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3);
    border-radius: 999px; transition: background .15s;
  }
  .btn-back:hover { background: rgba(255,255,255,.24); text-decoration: none; }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 24px 26px; margin-bottom: 16px;
  }
  .card h2 { font-size: 16px; font-weight: 620; letter-spacing: -.015em; margin-bottom: 5px; }
  .card .sub { font-size: 13px; color: var(--text-3); margin-bottom: 18px; line-height: 1.65; }

  .field { margin-bottom: 15px; }
  .field label {
    display: flex; align-items: center; gap: 7px;
    font-size: 12.5px; font-weight: 550; color: var(--text-2); margin-bottom: 7px;
  }
  .field label .opt {
    font-weight: 400; font-size: 11.5px; color: var(--text-3);
    padding: 1px 7px; background: #f0f2f6; border-radius: 999px;
  }
  .field input, .field textarea, .field select {
    width: 100%; padding: 10px 13px; font-size: 13.5px;
    background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input { height: 42px; }
  .field textarea { resize: vertical; min-height: 92px; line-height: 1.7; }
  .field select { height: 42px; cursor: pointer; }
  .field input:focus, .field textarea:focus, .field select:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3.5px rgba(11,95,212,.13);
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    height: 40px; padding: 0 20px; border-radius: var(--radius-sm);
    font-size: 13.5px; font-weight: 500; white-space: nowrap;
    transition: background .15s, border-color .15s, transform .08s, box-shadow .15s;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(11,95,212,.24); }
  .btn-primary:hover { background: var(--accent-2); }
  .btn-primary:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
  .btn-ghost { background: var(--surface); color: var(--text-2); border: 1px solid var(--line-strong); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--text); border-color: var(--text-3); }
  .btn-vote { height: 32px; padding: 0 14px; font-size: 12.5px; }
  .btn-voted { background: var(--ok-soft); color: var(--ok); border: 1px solid #b7e4c9; }

  .msg { margin-top: 16px; padding: 12px 15px; border-radius: var(--radius-sm);
    font-size: 13.5px; display: none; border-left: 3px solid transparent; }
  .msg.show { display: block; }
  .msg-ok { background: var(--ok-soft); color: var(--ok); border-left-color: var(--ok); }
  .msg-err { background: var(--err-soft); color: var(--err); border-left-color: var(--err); }
  .msg-info { background: var(--accent-soft); color: #0a56c2; border-left-color: var(--accent); }

  .idea {
    display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line);
  }
  .idea:last-child { border-bottom: 0; padding-bottom: 0; }
  .idea:first-child { padding-top: 0; }
  .idea-votes {
    flex: none; width: 52px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .idea-votes .n {
    font-size: 19px; font-weight: 650; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums; color: var(--accent);
  }
  .idea-votes .l { font-size: 11px; color: var(--text-3); }
  .idea-body { flex: 1; min-width: 0; }
  .idea-body .t { font-size: 14.5px; font-weight: 600; margin-bottom: 4px; }
  .idea-body .d { font-size: 13px; color: var(--text-2); line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .idea-body .m { font-size: 12px; color: var(--text-3); margin-top: 7px; display: flex; gap: 12px; flex-wrap: wrap; }
  .tag {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 11.5px; font-weight: 500; background: var(--violet-soft); color: var(--violet);
  }
  .empty { padding: 36px 16px; text-align: center; color: var(--text-3); font-size: 13.5px; }

  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(16px);
    background: #111827; color: #fff; padding: 11px 22px; border-radius: 9px;
    font-size: 13.5px; box-shadow: var(--shadow-lg);
    opacity: 0; pointer-events: none; transition: opacity .22s, transform .22s; z-index: 90;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  .foot { text-align: center; font-size: 12px; color: var(--text-3); margin-top: 30px; line-height: 1.9; }
</style>
</head>
<body>
<div class="shell">

  <div class="hero">
    <div class="hero-inner">
      <div class="hero-top">
        <img src="../icon.ico" alt="PCL3">
        <div>
          <h1>新功能投票</h1>
          <p>提出你的想法，让 PCL3 变得更好</p>
        </div>
        <div class="right"><a class="btn-back" href="../">返回首页</a></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>提交新想法</h2>
    <p class="sub">描述你希望 PCL3 增加的功能。提交后会显示在下方列表，其他用户可以投票支持。</p>

    <div class="field">
      <label>功能标题 <span class="opt">一句话说明</span></label>
      <input type="text" id="vTitle" maxlength="80" placeholder="例如：支持导入 MultiMC 整合包">
    </div>

    <div class="field">
      <label>详细说明 <span class="opt">选填</span></label>
      <textarea id="vDesc" maxlength="1000" placeholder="这个功能解决什么问题？你希望它怎么工作？"></textarea>
    </div>

    <div class="grid-2">
      <div class="field">
        <label>分类</label>
        <select id="vCat">
          <option>启动相关</option>
          <option>下载相关</option>
          <option>界面相关</option>
          <option>模组相关</option>
          <option selected>其他</option>
        </select>
      </div>
      <div class="field">
        <label>QQ 号 <span class="opt">选填，采纳后通知你</span></label>
        <input type="text" id="vQq" maxlength="12" inputmode="numeric" placeholder="123456789">
      </div>
    </div>

    <button class="btn btn-primary" id="btnSubmit">提交想法</button>
    <div class="msg" id="vMsg"></div>
  </div>

  <div class="card">
    <h2>大家的想法</h2>
    <p class="sub" id="vSub">正在加载……</p>
    <div id="vList"></div>
  </div>

  <div class="foot">
    Plain Craft Launcher 3 · 二次修改版，由 蕭遞 维护<br>
    原始作品版权归成都瓜皮龙科技有限公司所有
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '../api/index.php';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

let toastTimer = null;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('on');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2400);
}

function showMsg(text, type) {
  const el = $('vMsg');
  el.textContent = text;
  el.className = 'msg show msg-' + type;
}

async function get(action, params) {
  const qs = new URLSearchParams(Object.assign({ action, _: Date.now() }, params || {}));
  const r = await fetch(API + '?' + qs.toString());
  return await r.json();
}
async function post(action, data) {
  const r = await fetch(API + '?action=' + action, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams(data).toString()
  });
  return await r.json();
}

// 本机已投票记录（防止重复投票）
function votedSet() {
  try { return new Set(JSON.parse(localStorage.getItem('pcl3_voted') || '[]')); }
  catch { return new Set(); }
}
function markVoted(id) {
  const s = votedSet();
  s.add(id);
  localStorage.setItem('pcl3_voted', JSON.stringify([...s]));
}

async function loadList() {
  try {
    const j = await get('vote_list');
    if (!j.ok) { $('vSub').textContent = '加载失败：' + (j.error || '未知错误'); return; }
    const list = j.ideas || [];
    $('vSub').textContent = list.length ? '共 ' + list.length + ' 个想法，按票数排序' : '还没有人提交想法，来当第一个吧';
    if (!list.length) { $('vList').innerHTML = '<div class="empty">暂无想法</div>'; return; }

    const voted = votedSet();
    $('vList').innerHTML = list.map(it => {
      const has = voted.has(it.id);
      const meta = [];
      if (it.category) meta.push('<span class="tag">' + esc(it.category) + '</span>');
      if (it.time) meta.push(new Date(it.time * 1000).toLocaleDateString('zh-CN'));
      return '<div class="idea">' +
        '<div class="idea-votes">' +
          '<div class="n">' + (it.votes || 0) + '</div>' +
          '<button class="btn btn-vote ' + (has ? 'btn-voted' : 'btn-ghost') + '" data-vote="' + esc(it.id) + '"' +
            (has ? ' disabled' : '') + '>' + (has ? '已支持' : '支持') + '</button>' +
        '</div>' +
        '<div class="idea-body">' +
          '<div class="t">' + esc(it.title) + '</div>' +
          (it.desc ? '<div class="d">' + esc(it.desc) + '</div>' : '') +
          '<div class="m">' + meta.join('') + '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    $('vList').querySelectorAll('[data-vote]').forEach(b => {
      b.onclick = async () => {
        const id = b.dataset.vote;
        b.disabled = true;
        const j = await post('vote', { id });
        if (!j.ok) { toast('投票失败：' + (j.error || '未知错误')); b.disabled = false; return; }
        markVoted(id);
        toast('已支持这个想法');
        await loadList();
      };
    });
  } catch (e) {
    $('vSub').textContent = '加载失败：' + e.message;
  }
}

$('btnSubmit').onclick = async () => {
  const title = $('vTitle').value.trim();
  const desc = $('vDesc').value.trim();
  const category = $('vCat').value;
  const qq = $('vQq').value.trim();
  if (!title) return showMsg('请填写功能标题', 'err');

  const btn = $('btnSubmit');
  btn.disabled = true;
  try {
    const j = await post('vote_submit', { title, desc, category, qq });
    if (!j.ok) return showMsg('提交失败：' + (j.error || '未知错误'), 'err');
    showMsg('提交成功！你的想法已显示在下方列表。', 'ok');
    $('vTitle').value = '';
    $('vDesc').value = '';
    $('vQq').value = '';
    await loadList();
  } catch (e) {
    showMsg('提交失败：' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
};

loadList();
</script>
</body>
</html>
